apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
spec:
  replicas: 3
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
    spec:
      containers:
        - name: backend
          image: nginxdemos/hello
          ports:
            - containerPort: 80
#          env:
#            - name: NODE_ENV
#              value: "production"
#            - name: PORT
#              value: "3000"