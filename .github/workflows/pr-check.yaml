name: PR Checks

on:
  pull_request:
    branches: [week4]
  workflow_call:        # позволяет другому workflow вызвать этот через uses:

jobs:
  security-scan:
    name: "Security scan"
    uses: ./.github/workflows/sast-sca.yml

  typecheck:
    name: typecheck (${{ matrix.service }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service: [back, front]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: ${{ matrix.service }}/package-lock.json

      - name: Install deps
        working-directory: ${{ matrix.service }}
        run: npm ci

      - name: Type-check
        working-directory: ${{ matrix.service }}
        run: npx tsc --noEmit