image:
  name: atpradical/todo-back:latest
  pullSecret: dockerhub-cred

backend:
  port: 3000

resources:
  requests:
    cpu: "60m"
    memory: "100Mi"
  limits:
    cpu: "100m"
    memory: "120Mi"

config:
  NODE_ENV: "production"

ingress:
  host: api.ivan-dolgikh.com
  tlsSecret: backend-api-tls
  clusterIssuer: letsencrypt-prod

hpa:
  minReplicas: 1
  maxReplicas: 5
  cpuUtilization: 70
  memoryUtilization: 80

secret:
  dbHost: postgres
  dbPort: "5432"
  dbName: ""
  dbUser: ""
  dbPassword: ""